[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-cannon"
version = "1.1.0a1"
description = "Evidence-first outcome control for bounded AI work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Nobutaka Yamauchi" }]
keywords = ["ai", "agents", "verification", "outcomes", "audit", "decision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
vector-cannon = "vector_cannon.outcome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
